name: Build AndUEDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # อนุญาตให้กดสั่ง Run จากหน้าเว็บ GitHub ได้เอง

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        # โปรเจกต์นี้ใช้ submodules ดังนั้นต้องดึงโค้ดส่วนนี้มาด้วยครับ
        submodules: recursive

    - name: 🛠️ Install Dependencies
      run: |
        sudo apt-get update
        # สคริปต์ build.sh กำหนดให้ใช้ Ninja เป็น Generator สำหรับ CMake
        sudo apt-get install -y ninja-build cmake make

    - name: 📱 Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29 # สามารถเปลี่ยนเป็นเวอร์ชันอื่นเช่น r26b ได้ตามต้องการ
        add-to-path: false

    - name: ⚙️ Set NDK_HOME Environment Variable
      run: |
        # สคริปต์ของโปรเจกต์ต้องการ NDK_HOME เราจึงต้องตั้งค่าตัวแปรนี้ครับ
        echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

    - name: 🏗️ Build Project via build.sh
      run: |
        cd AndUEDumper
        # build.sh มีการถาม Interactive ว่าเอา CMake หรือ ndk-build
        # ใช้ echo "1" | เพื่อป้อนค่าเลือก [1] CMake แบบอัตโนมัติครับ
        echo "1" | bash ./build.sh

    - name: 📦 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AndUEDumper-Linux-Artifacts
        path: AndUEDumper/cmake_build/

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: 📱 Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29
        add-to-path: false

    - name: ⚙️ Set NDK_HOME Environment Variable
      run: |
        # ตั้งค่า NDK_HOME สำหรับฝั่ง Windows
        echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: 🏗️ Build Project via build.bat
      run: |
        cd AndUEDumper
        # ใช้ echo 1 | เพื่อป้อนค่าเลือก [1] CMake ลงใน build.bat แบบอัตโนมัติ
        echo 1 | cmd /c build.bat

    - name: 📦 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AndUEDumper-Windows-Artifacts
        path: AndUEDumper/cmake_build/